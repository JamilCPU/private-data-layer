# Copy to assistant.yaml. Any field can be overridden by an ASSISTANT_<FIELD> env var.
gateway_url: https://gateway.example
# Optional: the gateway URL browsers should use when it differs (e.g. in-cluster service vs ingress host).
# gateway_public_url: https://gateway.example
ollama_url: http://ollama.example:11434
model: qwen3.5:27b
client_id: personal-assistant
client_secret_file: /run/secrets/assistant-client-secret
secrets_file: /run/secrets/assistant-secrets.yaml
db_path: /data/assistant.db
public_url: https://assistant.example
listen_host: 0.0.0.0
listen_port: 8790
max_tool_steps: 6
model_timeout_s: 120
tool_timeout_s: 60
session_ttl_s: 43200
system_prompt_extra: ""
# Optional: push notifications (the morning briefing) to a self-hosted ntfy server; unset = log only.
# ntfy_url: https://ntfy.example
# ntfy_topic: briefing
# ntfy_token_file: /run/secrets/ntfy-token
# Morning briefing (pdl-assistant-briefing): local time zone, the HH:MM after which an offline
# model skips the day, seconds between probes while waiting, and how many news items to pick.
# briefing_timezone: America/Chicago
# briefing_retry_until: "10:00"
# briefing_retry_interval_s: 900
# briefing_news_count: 3
# Flagger (hourly threshold checks): the checks file (see flagger.example.yaml), days of history
# to scan, and whether to skip a run instead of degrading when the model is offline.
# flagger_config_file: /etc/assistant/flagger.yaml
# flagger_lookback_days: 45
# flagger_require_brain: false
