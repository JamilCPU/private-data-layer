[project]
name = "pdl-assistant"
version = "0.1.0"
description = "Personal assistant harness for the private data layer"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.30,<2",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyyaml>=6",
    "pydantic>=2",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
]

[project.scripts]
pdl-assistant = "pdl_assistant.__main__:main"
pdl-assistant-new-api-token = "pdl_assistant.cli_tokens:new_api_token"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",
    "asgi-lifespan>=2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdl_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=pdl_assistant --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"
