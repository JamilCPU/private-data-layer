# API token hashes are generated by `uv run pdl-assistant-new-api-token --name <name>`.
api_tokens:
  phone: pbkdf2_sha256$200000$REPLACE$REPLACE
# At least 32 characters, e.g. python -c "import secrets; print(secrets.token_urlsafe(48))"
cookie_secret: REPLACE-WITH-A-RANDOM-STRING-OF-AT-LEAST-32-CHARS
