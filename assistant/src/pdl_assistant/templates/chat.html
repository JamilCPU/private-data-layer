<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant</title>
<style>
  :root { color-scheme: light dark; --line: #8884; --muted: #888; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, sans-serif; display: flex; height: 100vh; }
  nav { width: 240px; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  nav header { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); }
  nav ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  nav li button { width: 100%; text-align: left; padding: 8px 10px; border: 0; background: none;
    color: inherit; font: inherit; cursor: pointer; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  nav li button.active, nav li button:hover { background: #8882; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { margin: 0 0 12px; white-space: pre-wrap; word-wrap: break-word; }
  .msg .role { display: block; font-size: 12px; color: var(--muted); }
  details.toolrow { margin: 0 0 8px; color: var(--muted); font-size: 12px; opacity: .75; }
  details.toolrow summary { cursor: pointer; }
  details.toolrow pre { margin: 4px 0 0; white-space: pre-wrap; word-wrap: break-word; }
  #status { padding: 0 16px; min-height: 1.4em; font-size: 13px; color: var(--muted); }
  form#send { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  textarea { flex: 1; min-height: 3em; resize: vertical; font: inherit; padding: 6px; }
  button { font: inherit; padding: 6px 12px; }
  @media (max-width: 640px) { nav { display: none; } }
</style>
</head>
<body>
<nav>
  <header>
    <button type="button" id="new">New chat</button>
    <form method="post" action="/logout"><button type="submit">Logout</button></form>
  </header>
  <ul id="conversations"></ul>
</nav>
<main>
  <div id="messages"></div>
  <div id="status"></div>
  <form id="send">
    <textarea id="input" maxlength="4000" placeholder="Ask something" required></textarea>
    <button type="submit" id="sendButton">Send</button>
  </form>
</main>
<script>
(function () {
  "use strict";
  var current = null;
  var list = document.getElementById("conversations");
  var pane = document.getElementById("messages");
  var statusLine = document.getElementById("status");
  var input = document.getElementById("input");
  var sendButton = document.getElementById("sendButton");

  // All text is set with textContent: model output is never parsed as HTML.
  function addMessage(role, content) {
    var div = document.createElement("div");
    div.className = "msg " + role;
    var label = document.createElement("span");
    label.className = "role";
    label.textContent = role;
    var body = document.createElement("span");
    body.textContent = content;
    div.appendChild(label);
    div.appendChild(body);
    pane.appendChild(div);
    pane.scrollTop = pane.scrollHeight;
  }

  // Tool results and tool-call records: a collapsed, dimmed "tool: <name>" line.
  function addToolRow(name, content) {
    var details = document.createElement("details");
    details.className = "toolrow";
    var summary = document.createElement("summary");
    summary.textContent = name === "__calls__" ? "tool: calls" : "tool: " + name;
    var body = document.createElement("pre");
    body.textContent = content;
    details.appendChild(summary);
    details.appendChild(body);
    pane.appendChild(details);
  }

  async function api(path, options) {
    var resp = await fetch(path, Object.assign({ credentials: "same-origin" }, options || {}));
    if (resp.status === 401) { window.location.href = "/login"; throw new Error("login required"); }
    var data = null;
    try { data = await resp.json(); } catch (e) { data = null; }
    if (!resp.ok || data === null) {
      throw new Error((data && data.error) || ("HTTP " + resp.status));
    }
    return data;
  }

  async function loadConversations() {
    var data = await api("/api/conversations");
    list.replaceChildren();
    data.conversations.forEach(function (c) {
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = c.title || ("Conversation " + c.id);
      if (c.id === current) { b.className = "active"; }
      b.addEventListener("click", function () { openConversation(c.id); });
      li.appendChild(b);
      list.appendChild(li);
    });
  }

  async function openConversation(id) {
    current = id;
    statusLine.textContent = "";
    var data = await api("/api/conversations/" + id + "/messages");
    pane.replaceChildren();
    data.messages.forEach(function (m) {
      if (m.tool_name) { addToolRow(m.tool_name, m.content); } else { addMessage(m.role, m.content); }
    });
    pane.scrollTop = pane.scrollHeight;
    loadConversations();
  }

  document.getElementById("new").addEventListener("click", function () {
    current = null;
    pane.replaceChildren();
    statusLine.textContent = "";
    loadConversations();
  });

  document.getElementById("send").addEventListener("submit", async function (event) {
    event.preventDefault();
    var text = input.value;
    if (!text.trim()) { return; }
    addMessage("user", text);
    input.value = "";
    sendButton.disabled = true;
    statusLine.textContent = "thinking...";
    try {
      var data = await api("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ conversation_id: current, message: text })
      });
      current = data.conversation_id;
      addMessage("assistant", data.reply);
      var notes = [];
      if (data.offline) { notes.push("offline"); }
      if (data.tool_calls.length) { notes.push("tool calls: " + data.tool_calls.join(", ")); }
      if (data.step_capped) { notes.push("stopped at the tool-step limit"); }
      statusLine.textContent = notes.join(" | ");
      loadConversations();
    } catch (err) {
      statusLine.textContent = "error: " + err.message;
    } finally {
      sendButton.disabled = false;
      input.focus();
    }
  });

  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      document.getElementById("send").requestSubmit();
    }
  });

  loadConversations().catch(function (err) { statusLine.textContent = "error: " + err.message; });
})();
</script>
</body>
</html>
