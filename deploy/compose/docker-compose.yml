# Local development stack: gateway + homestudio-mcp + a fixture Home Studio stub + assistant,
# plus postgres, bank-mcp, email-mcp and search-mcp (with SearXNG) (and, with `--profile jobs`, the importer and mail sync).
# Create gateway secrets and .env first; see README.md.
services:
  gateway:
    build: ../../gateway
    ports:
      # Loopback only: the dev stack runs on dev secrets and must not be reachable from the LAN.
      - "127.0.0.1:8787:8787"
    volumes:
      - ./gateway.dev.yaml:/etc/pdl/gateway.yaml:ro
      - ./secrets.dev.yaml:/etc/pdl/secrets.yaml:ro
      - gateway-data:/data
    environment:
      HOMESTUDIO_MCP_SECRET: ${HOMESTUDIO_MCP_SECRET:?copy .env.example to .env and set it}
      BANK_MCP_SECRET: ${BANK_MCP_SECRET:?copy .env.example to .env and set it}
      EMAIL_MCP_SECRET: ${EMAIL_MCP_SECRET:?copy .env.example to .env and set it}
      SEARCH_MCP_SECRET: ${SEARCH_MCP_SECRET:?copy .env.example to .env and set it}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8787/healthz", timeout=4)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  homestudio-mcp:
    image: ghcr.io/jamilcpu/homestudio-mcp:latest
    environment:
      HOMESTUDIO_API_URL: http://homestudio-stub:8765
      HOMESTUDIO_MCP_SHARED_SECRET: ${HOMESTUDIO_MCP_SECRET:?copy .env.example to .env and set it}
    depends_on:
      homestudio-stub:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=4)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  homestudio-stub:
    build: ./stub-homestudio
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8765/api/status", timeout=4)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Dev-only database. The cluster uses the Lab Data Store with separate roles per source
  # (bank_owner/bank_reader, email_owner/email_reader); here one role owns everything.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set it}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_dev -d lab"]
      interval: 5s
      timeout: 5s
      retries: 10

  bank-mcp:
    build: ../../servers/bank-mcp
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      BANK_MCP_SHARED_SECRET: ${BANK_MCP_SECRET:?copy .env.example to .env and set it}
      BANK_MCP_HOST: 0.0.0.0
      BANK_MCP_PORT: "8000"
      BANK_STORE: postgres
      # The server only reads; the schema is created by the one-shot bank-import service below
      # (run it once first: docker compose --profile jobs run --rm bank-import).
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: lab
      PGUSER: lab_dev
      PGPASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set it}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=4)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  email-mcp:
    build: ../../servers/email-mcp
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      EMAIL_MCP_SHARED_SECRET: ${EMAIL_MCP_SECRET:?copy .env.example to .env and set it}
      EMAIL_MCP_HOST: 0.0.0.0
      EMAIL_MCP_PORT: "8000"
      EMAIL_STORE: postgres
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: lab
      PGUSER: lab_dev
      PGPASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set it}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=4)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Dev-only metasearch backend for search-mcp (the cluster runs it in deploy/k8s/searxng).
  searxng:
    image: docker.io/searxng/searxng:2026.11.2-cccbc9e15
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?copy .env.example to .env and set it}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  search-mcp:
    build: ../../servers/search-mcp
    ports:
      - "127.0.0.1:8003:8000"
    environment:
      SEARCH_MCP_SHARED_SECRET: ${SEARCH_MCP_SECRET:?copy .env.example to .env and set it}
      SEARCH_MCP_HOST: 0.0.0.0
      SEARCH_MCP_PORT: "8000"
      SEARCH_SEARXNG_URL: http://searxng:8080
    depends_on:
      searxng:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=4)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot jobs (not started by a plain `up`): docker compose --profile jobs run --rm <name>
  bank-import:
    profiles: [jobs]
    build: ../../servers/bank-mcp
    command:
      - pdl-bank-import
      - --inbox
      - /data/bank/inbox
      - --processed
      - /data/bank/processed
      - --rules
      - /etc/pdl/bank/rules.yaml
      - --mappings
      - /etc/pdl/bank/csv-mappings.yaml
      - --once
    environment:
      BANK_STORE: postgres
      BANK_APPLY_MIGRATIONS: "1"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: lab
      PGUSER: lab_dev
      PGPASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set it}
    volumes:
      # ./data is gitignored; put statements in ./data/bank/inbox (see README.md).
      - ./data/bank:/data/bank
      - ./bank-rules.dev.yaml:/etc/pdl/bank/rules.yaml:ro
      - ./bank-csv-mappings.dev.yaml:/etc/pdl/bank/csv-mappings.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  email-sync:
    profiles: [jobs]
    build: ../../servers/email-mcp
    command: [pdl-email-sync, --once]
    environment:
      EMAIL_STORE: postgres
      EMAIL_APPLY_MIGRATIONS: "1"
      EMAIL_IMAP_HOST: ${EMAIL_IMAP_HOST:-}
      EMAIL_IMAP_USER: ${EMAIL_IMAP_USER:-}
      EMAIL_IMAP_PORT: "993"
      EMAIL_MAILBOX: INBOX
      EMAIL_INITIAL_DAYS: "90"
      EMAIL_IMAP_PASSWORD_FILE: /run/secrets/imap.password
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: lab
      PGUSER: lab_dev
      PGPASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set it}
    volumes:
      - ./imap.password:/run/secrets/imap.password:ro
    depends_on:
      postgres:
        condition: service_healthy

  assistant:
    build: ../../assistant
    ports:
      # Loopback only: the dev stack runs on dev secrets and must not be reachable from the LAN.
      - "127.0.0.1:8790:8790"
    environment:
      # API calls go to the compose gateway by service name. The browser login is redirected to
      # that same address, so see README.md for the one-line hosts entry.
      ASSISTANT_GATEWAY_URL: http://gateway:8787
      ASSISTANT_PUBLIC_URL: http://localhost:8790
      ASSISTANT_OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-qwen3.5:27b}
      ASSISTANT_DB_PATH: /data/assistant.db
      ASSISTANT_SECRETS_FILE: /etc/pdl/assistant-secrets.yaml
      ASSISTANT_CLIENT_SECRET_FILE: /run/secrets/pa.secret
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./assistant-secrets.dev.yaml:/etc/pdl/assistant-secrets.yaml:ro
      - ./pa.secret:/run/secrets/pa.secret:ro
      - assistant-data:/data
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8790/healthz", timeout=4)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  gateway-data:
  assistant-data:
  postgres-data:
