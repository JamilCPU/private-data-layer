# Local development stack: gateway + homestudio-mcp + a fixture Home Studio stub + assistant.
# Create gateway secrets and .env first; see README.md.
services:
  gateway:
    build: ../../gateway
    ports:
      # Loopback only: the dev stack runs on dev secrets and must not be reachable from the LAN.
      - "127.0.0.1:8787:8787"
    volumes:
      - ./gateway.dev.yaml:/etc/pdl/gateway.yaml:ro
      - ./secrets.dev.yaml:/etc/pdl/secrets.yaml:ro
      - gateway-data:/data
    environment:
      HOMESTUDIO_MCP_SECRET: ${HOMESTUDIO_MCP_SECRET:?copy .env.example to .env and set it}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8787/healthz", timeout=4)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  homestudio-mcp:
    image: ghcr.io/jamilcpu/homestudio-mcp:latest
    environment:
      HOMESTUDIO_API_URL: http://homestudio-stub:8765
      HOMESTUDIO_MCP_SHARED_SECRET: ${HOMESTUDIO_MCP_SECRET:?copy .env.example to .env and set it}
    depends_on:
      homestudio-stub:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=4)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  homestudio-stub:
    build: ./stub-homestudio
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8765/api/status", timeout=4)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  assistant:
    build: ../../assistant
    ports:
      # Loopback only: the dev stack runs on dev secrets and must not be reachable from the LAN.
      - "127.0.0.1:8790:8790"
    environment:
      # API calls go to the compose gateway by service name. The browser login is redirected to
      # that same address, so see README.md for the one-line hosts entry.
      ASSISTANT_GATEWAY_URL: http://gateway:8787
      ASSISTANT_PUBLIC_URL: http://localhost:8790
      ASSISTANT_OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-qwen3.5:27b}
      ASSISTANT_DB_PATH: /data/assistant.db
      ASSISTANT_SECRETS_FILE: /etc/pdl/assistant-secrets.yaml
      ASSISTANT_CLIENT_SECRET_FILE: /run/secrets/pa.secret
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./assistant-secrets.dev.yaml:/etc/pdl/assistant-secrets.yaml:ro
      - ./pa.secret:/run/secrets/pa.secret:ro
      - assistant-data:/data
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8790/healthz", timeout=4)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  gateway-data:
  assistant-data:
