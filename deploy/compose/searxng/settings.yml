# Dev-only SearXNG settings (mirrors deploy/k8s/searxng/settings-configmap.yaml).
# The secret key comes from SEARXNG_SECRET in .env, never from this file.
use_default_settings: true
search:
  formats: [html, json]
  safe_search: 1
  autocomplete: ""
server:
  limiter: false
  image_proxy: false
  method: GET
outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
