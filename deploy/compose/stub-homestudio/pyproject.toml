[project]
name = "stub-homestudio"
version = "0.1.0"
description = "Fixture-only stand-in for the Home Studio REST API, for local compose runs and CI"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["."]
