# Shape of the out-of-band Secret. Never commit a filled-in copy; create it with kubectl from
# the helper outputs (see README.md, "Assistant"). Values below are placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: assistant-secrets
  namespace: lab
type: Opaque
stringData:
  # The plaintext gateway client secret for `personal-assistant` (the pa.secret file whose hash
  # is in the gateway's secrets.yaml).
  client.secret: REPLACE-plaintext-client-secret
  secrets.yaml: |
    cookie_secret: REPLACE-at-least-32-random-characters
    api_tokens:
      openwebui: pbkdf2_sha256$200000$REPLACE$REPLACE
