# assistant.lab on :443 only. Traefik terminates TLS with the lab certificate in the out-of-band
# Secret `assistant-lab-tls` (made by ../make-lab-tls.sh assistant.lab assistant-lab-tls).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: assistant
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # cert-manager issues and renews the certificate from the lab CA into the TLS Secret below.
    cert-manager.io/cluster-issuer: lab-ca
spec:
  tls:
    - hosts: [assistant.lab]
      secretName: assistant-lab-tls
  rules:
    - host: assistant.lab
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: assistant, port: {name: http}}}}
