# Morning briefing: builds a summary through the gateway and the lab's Ollama, pushes it to the
# phone via the in-cluster ntfy, and records the outcome in the assistant's SQLite database
# (shared with the assistant Deployment through the same hostPath; WAL handles both writers).
# The job waits for Ollama until the local cut-off (default 10:00) and records `skipped` if it
# stays offline, so the deadline only has to cover that wait plus the model time.
#
# Out-of-band objects (never committed; see ../README.md "Briefing"): Secret `ntfy-publish`
# (token), ConfigMap `briefing-config` (ASSISTANT_NTFY_TOPIC, ASSISTANT_BRIEFING_TIMEZONE), plus
# everything the assistant Deployment needs (assistant-secrets, assistant-config, lab-ca).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: briefing
  labels: {app: briefing}
spec:
  schedule: "30 7 * * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 10800
      template:
        metadata:
          labels: {app: briefing}
        spec:
          restartPolicy: Never
          nodeSelector:
            role: primary-worker   # the SQLite database lives on this node's data disk
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: briefing
              # The tag is a placeholder: the controller pins the built git sha in kustomization.yaml.
              image: registry.lab/lab/pdl-assistant:latest
              imagePullPolicy: Always
              command: ["pdl-assistant-briefing"]
              envFrom:
                - configMapRef: {name: assistant-config}
              env:
                - {name: ASSISTANT_GATEWAY_URL, value: "http://gateway:8787"}
                - {name: ASSISTANT_GATEWAY_PUBLIC_URL, value: "https://gateway.lab"}
                - {name: SSL_CERT_FILE, value: /etc/pdl/ca/lab-ca.pem}
                - {name: ASSISTANT_PUBLIC_URL, value: "https://assistant.lab"}
                - {name: ASSISTANT_DB_PATH, value: /data/assistant.db}
                - {name: ASSISTANT_SECRETS_FILE, value: /etc/pdl/assistant-secrets.yaml}
                - {name: ASSISTANT_CLIENT_SECRET_FILE, value: /etc/pdl/client.secret}
                - {name: ASSISTANT_NTFY_URL, value: "http://ntfy"}
                - {name: ASSISTANT_NTFY_TOKEN_FILE, value: /etc/pdl/ntfy.token}
                - name: ASSISTANT_NTFY_TOPIC
                  valueFrom: {configMapKeyRef: {name: briefing-config, key: ASSISTANT_NTFY_TOPIC}}
                - name: ASSISTANT_BRIEFING_TIMEZONE
                  valueFrom:
                    configMapKeyRef: {name: briefing-config, key: ASSISTANT_BRIEFING_TIMEZONE, optional: true}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              volumeMounts:
                - {name: secrets, mountPath: /etc/pdl/assistant-secrets.yaml, subPath: secrets.yaml, readOnly: true}
                - {name: secrets, mountPath: /etc/pdl/client.secret, subPath: client.secret, readOnly: true}
                - {name: ntfy-token, mountPath: /etc/pdl/ntfy.token, subPath: token, readOnly: true}
                - {name: lab-ca, mountPath: /etc/pdl/ca, readOnly: true}
                - {name: data, mountPath: /data}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: secrets
              secret:
                secretName: assistant-secrets
                defaultMode: 0440
                items:
                  - {key: secrets.yaml, path: secrets.yaml}
                  - {key: client.secret, path: client.secret}
            - name: ntfy-token
              secret:
                secretName: ntfy-publish
                defaultMode: 0440
                items:
                  - {key: token, path: token}
            - name: lab-ca
              configMap: {name: lab-ca}
            - name: data
              hostPath: {path: /data/lab/private-data-layer/assistant, type: DirectoryOrCreate}
            - name: tmp
              emptyDir: {}
