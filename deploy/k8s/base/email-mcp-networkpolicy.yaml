# Only gateway pods may talk to email-mcp (second layer beside the shared-secret header).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: email-mcp-from-gateway
spec:
  podSelector:
    matchLabels: {app: email-mcp}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: gateway}
      ports:
        - {protocol: TCP, port: 8000}
