# The gateway's public config. Secrets (passphrase hash, client secret hashes, backend
# credentials) live in the out-of-band Secret `gateway-secrets`; see ../README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  gateway.yaml: |
    issuer_url: https://gateway.lab
    resource_url: https://gateway.lab/mcp
    listen_host: 0.0.0.0
    listen_port: 8787
    db_path: /data/gateway.db
    audit_dir: /data/audit
    scopes: [homestudio:read, automations:read, email:read, sms:read, bank:read, search:read, gateway:audit]
    backends:
      - name: homestudio
        url: http://homestudio-mcp:8000/mcp
        scope: homestudio:read
        secret_header: X-Gateway-Secret
        secret_env: HOMESTUDIO_MCP_SECRET
      # Automations (pa-mcp) is enabled once its TLS trust is settled: it serves TLS with its own
      # pinned certificate, so the gateway needs that certificate as ca_file (mounted from an
      # out-of-band ConfigMap) and a URL whose name the certificate covers.
      # - name: automations
      #   url: https://mcp.automations.lab/mcp
      #   scope: automations:read
      #   bearer_env: AUTOMATIONS_MCP_TOKEN
      #   ca_file: /etc/pdl/automations-ca.pem
      #   allow_tools: [list_devices, get_device, list_programs, get_program, get_program_logs, get_usb_power, recent_history]
    grants:
      - name: personal-assistant
        kind: headless
        scopes: [homestudio:read, automations:read, email:read, sms:read, bank:read, search:read, gateway:audit]
      - name: interactive-default
        kind: interactive
        scopes: [homestudio:read, automations:read]
