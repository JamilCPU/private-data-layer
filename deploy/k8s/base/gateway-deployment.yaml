# MCP gateway: OAuth 2.1 server + scope-filtering proxy. State (SQLite token store, JSONL audit
# log) lives on the primary worker's data disk, so the pod is pinned there with the role label
# every stateful lab app uses, never by node name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: {app: gateway}
spec:
  replicas: 1
  strategy: {type: Recreate}   # SQLite: never two gateways at once
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      nodeSelector:
        role: primary-worker
      # Service-link env vars (GATEWAY_PORT=tcp://...) would clash with the image's own
      # GATEWAY_PORT; fsGroup makes the Secret/ConfigMap files readable by the gateway's uid.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # hostPath directories are created root-owned; hand them to the gateway's uid once.
        # Also copies the hub certificate (root-readable only on the node) to a volume the
        # gateway can read; it is the CA for the Automations backend.
        - name: own-data
          image: busybox:1.37
          command: [sh, -c, "chown -R 10001:10001 /data && cp /hub-cert.pem /ca/automations-ca.pem && chmod 0444 /ca/automations-ca.pem"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            # chown needs CHOWN/FOWNER; DAC_OVERRIDE lets root read the 0600 hub certificate,
            # which another uid owns.
            capabilities: {drop: [ALL], add: [CHOWN, FOWNER, DAC_OVERRIDE]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: hub-cert, mountPath: /hub-cert.pem, readOnly: true}
            - {name: ca, mountPath: /ca}
      containers:
        - name: gateway
          image: registry.lab/lab/pdl-gateway:99f3ef2
          imagePullPolicy: Always
          ports:
            - {name: http, containerPort: 8787}
          env:
            # Only the backend credentials become env vars; the Secret's secrets.yaml key is a file.
            - name: HOMESTUDIO_MCP_SECRET
              valueFrom: {secretKeyRef: {name: gateway-secrets, key: HOMESTUDIO_MCP_SECRET}}
            - name: BANK_MCP_SECRET
              valueFrom: {secretKeyRef: {name: gateway-secrets, key: BANK_MCP_SECRET}}
            - name: EMAIL_MCP_SECRET
              valueFrom: {secretKeyRef: {name: gateway-secrets, key: EMAIL_MCP_SECRET}}
            - name: SEARCH_MCP_SECRET
              valueFrom: {secretKeyRef: {name: gateway-secrets, key: SEARCH_MCP_SECRET}}
            - name: SMS_MCP_SECRET
              valueFrom: {secretKeyRef: {name: gateway-secrets, key: SMS_MCP_SECRET}}
            # pa-mcp runs with hostNetwork on the primary node and its certificate names only that
            # node's address, so the gateway reaches it at https://${NODE_IP}:7702 (expanded by the
            # gateway at startup) with the hub certificate as CA, using pa-mcp's own bearer token.
            - name: NODE_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
            - name: AUTOMATIONS_MCP_TOKEN
              valueFrom: {secretKeyRef: {name: pa-mcp, key: PA_MCP_HTTP_TOKEN}}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/pdl/gateway.yaml, subPath: gateway.yaml, readOnly: true}
            - {name: secrets, mountPath: /etc/pdl/secrets.yaml, subPath: secrets.yaml, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - {name: ca, mountPath: /etc/pdl/ca, readOnly: true}
      volumes:
        - name: config
          configMap: {name: gateway-config}
        - name: secrets
          secret: {secretName: gateway-secrets, defaultMode: 0440, items: [{key: secrets.yaml, path: secrets.yaml}]}
        - name: data
          hostPath: {path: /data/lab/private-data-layer, type: DirectoryOrCreate}
        - name: tmp
          emptyDir: {}
        - name: hub-cert
          # Only the certificate file (key.pem sits next to it).
          hostPath: {path: /data/lab/personal-automations/personal-automations/hub/cert.pem, type: File}
        - name: ca
          emptyDir: {}
