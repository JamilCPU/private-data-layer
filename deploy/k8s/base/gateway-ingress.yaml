# gateway.lab on :443 only. Traefik terminates TLS with the lab certificate in the out-of-band
# Secret `gateway-lab-tls` (made by ../make-lab-tls.sh); OAuth issuer rules forbid plain HTTP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts: [gateway.lab]
      secretName: gateway-lab-tls
  rules:
    - host: gateway.lab
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: gateway, port: {name: http}}}}
