# gateway.lab on :443 only. Traefik terminates TLS with the certificate cert-manager issues from
# the lab CA into Secret `gateway-lab-tls`; OAuth issuer rules forbid plain HTTP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # cert-manager issues and renews the certificate from the lab CA into the TLS Secret below.
    cert-manager.io/cluster-issuer: lab-ca
spec:
  tls:
    - hosts: [gateway.lab]
      secretName: gateway-lab-tls
  rules:
    - host: gateway.lab
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: gateway, port: {name: http}}}}
