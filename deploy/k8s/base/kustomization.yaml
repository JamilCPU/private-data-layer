# Copy of lab-gitops apps/private-data-layer (the deployed version); keep the two in sync.
# homestudio-mcp is pulled from GHCR by digest; pdl-gateway, pdl-assistant, pdl-bank-mcp, pdl-email-mcp and pdl-search-mcp are built on
# the primary node into the lab registry until their GHCR packages are public. Bump tags/digests here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lab
commonLabels:
  app.kubernetes.io/part-of: private-data-layer
resources:
  - gateway-configmap.yaml
  - gateway-deployment.yaml
  - gateway-service.yaml
  - gateway-ingress.yaml
  - assistant-deployment.yaml
  - assistant-service.yaml
  - assistant-ingress.yaml
  - briefing-cronjob.yaml
  - homestudio-mcp-deployment.yaml
  - homestudio-mcp-service.yaml
  - homestudio-mcp-networkpolicy.yaml
  - bank-mcp-deployment.yaml
  - bank-mcp-service.yaml
  - bank-mcp-networkpolicy.yaml
  - bank-importer-cronjob.yaml
  - email-mcp-deployment.yaml
  - email-mcp-service.yaml
  - email-mcp-networkpolicy.yaml
  - search-mcp-deployment.yaml
  - search-mcp-service.yaml
  - search-mcp-networkpolicy.yaml
  - email-sync-cronjob.yaml
images:
  # Tags are the git sha the image was built from; the lab-gitops copy carries the deployed pins.
  - name: registry.lab/lab/pdl-gateway
    newTag: 395260f
  - name: registry.lab/lab/pdl-assistant
    newTag: latest
  - name: registry.lab/lab/pdl-bank-mcp
    newTag: latest
  - name: registry.lab/lab/pdl-email-mcp
    newTag: latest
  - name: registry.lab/lab/pdl-search-mcp
    newTag: latest
  - name: ghcr.io/jamilcpu/homestudio-mcp
    digest: sha256:fec0bc38f8462cbb10298c14f48511cc421aa022f0e2a47925b653ffe5d5ee71
