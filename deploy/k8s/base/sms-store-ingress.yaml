# sms.lab on :443 only, and only the two paths the phone needs: POST /messages and /healthz.
# Traefik terminates TLS with the certificate cert-manager issues from the lab CA into Secret
# `sms-lab-tls`. Everything else on the host answers 404 from Traefik.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sms-store
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: lab-ca
spec:
  tls:
    - hosts: [sms.lab]
      secretName: sms-lab-tls
  rules:
    - host: sms.lab
      http:
        paths:
          - {path: /messages, pathType: Exact, backend: {service: {name: sms-store, port: {name: http}}}}
          - {path: /healthz, pathType: Exact, backend: {service: {name: sms-store, port: {name: http}}}}
