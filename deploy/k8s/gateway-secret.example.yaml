# Documentation only. Do not fill this in and commit it; it is not part of the kustomization.
# Create the real Secret from the helper outputs instead (README.md, step 4):
#   kubectl -n pdl create secret generic gateway-secrets \
#     --from-file=secrets.yaml=./secrets.yaml \
#     --from-literal=HOMESTUDIO_MCP_SECRET=... \
#     --from-literal=AUTOMATIONS_MCP_TOKEN=...
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: pdl
type: Opaque
stringData:
  # Hashed approval passphrase and client secrets: the output of pdl-set-passphrase and
  # pdl-new-client-secret, assembled as in gateway/secrets.example.yaml.
  secrets.yaml: |
    approval_passphrase: <output of pdl-set-passphrase>
    client_secrets:
      personal-assistant: <hash printed by pdl-new-client-secret>
  # Shared secret: the gateway sends it to homestudio-mcp, which checks it.
  # Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"
  HOMESTUDIO_MCP_SECRET: <random string>
  # Bearer token for the Personal Automations MCP server.
  AUTOMATIONS_MCP_TOKEN: <token for the Automations MCP server>
