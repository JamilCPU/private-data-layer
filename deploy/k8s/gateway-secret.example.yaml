# Shape of the out-of-band Secret. Never commit a filled-in copy; create it with kubectl from
# the helper outputs (see README.md step 3). Values below are placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: lab
type: Opaque
stringData:
  secrets.yaml: |
    approval_passphrase: pbkdf2_sha256$200000$REPLACE$REPLACE
    client_secrets:
      personal-assistant: pbkdf2_sha256$200000$REPLACE$REPLACE
  HOMESTUDIO_MCP_SECRET: REPLACE-random-shared-secret
  AUTOMATIONS_MCP_TOKEN: REPLACE-bearer-token-the-automations-mcp-expects
