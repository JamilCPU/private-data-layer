[project]
name = "pdl-bank-mcp"
version = "0.1.0"
description = "Read-only bank MCP backend and statement importer for the private data layer"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.30,<2",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyyaml>=6",
    "pydantic>=2",
    "ofxparse>=0.21",
    "psycopg[binary]>=3.2",
]

[project.scripts]
pdl-bank-mcp = "pdl_bank.__main__:main"
pdl-bank-import = "pdl_bank.importer:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdl_bank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=pdl_bank --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"
