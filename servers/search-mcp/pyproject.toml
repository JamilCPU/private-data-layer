[project]
name = "pdl-search-mcp"
version = "0.1.0"
description = "Web search and page fetch MCP backend (SearXNG) for the private data layer"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.30,<2",
    "uvicorn[standard]>=0.30",
    "starlette>=0.40",
    "httpx>=0.27",
    "pydantic>=2",
    "trafilatura>=1.12",
]

[project.scripts]
pdl-search-mcp = "pdl_search.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdl_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
addopts = "--cov=pdl_search --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"
