[project]
name = "pdl-sms-mcp"
version = "0.1.0"
description = "Read-only text message MCP backend for the private data layer"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.30,<2",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "starlette>=0.40",
    "pydantic>=2",
]

[project.scripts]
pdl-sms-mcp = "pdl_sms.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdl_sms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
addopts = "--cov=pdl_sms --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"
