[project]
name = "pdl-sms-store"
version = "0.1.0"
description = "SMS message store, device tokens and migrations for the private data layer"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6",
    "psycopg[binary]>=3.2",
]

[project.scripts]
pdl-sms-store = "pdl_sms_store.__main__:main"
pdl-sms-new-device-token = "pdl_sms_store.cli_tokens:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdl_sms_store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
addopts = "--cov=pdl_sms_store --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"
